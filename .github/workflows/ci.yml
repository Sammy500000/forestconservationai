name: ForestWatch CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install -e ".[dev,ml]"

      - name: Run tests
        run: python -m pytest

      - name: Run Phase 2 smoke verification
        run: python scripts/verify_phase2.py

      - name: Run Ruff
        run: python -m ruff check .

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build application image
        run: docker build -t forestwatch:phase2 .
