name: Ruff Debug

on:
  push:
    branches:
      - phase-5-integration

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.8,<1"
      - run: python -m ruff check --fix scripts/run_phase5_demo.py || true
      - run: git diff -- scripts/run_phase5_demo.py
