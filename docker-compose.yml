services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      FORESTWATCH_APP_HOST: 0.0.0.0
      FORESTWATCH_APP_PORT: 8500
      FORESTWATCH_LOG_LEVEL: INFO
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "8500:8500"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/healthz', timeout=2).read()"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
